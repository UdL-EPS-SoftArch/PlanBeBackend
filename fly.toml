# fly.toml app configuration file generated for spring-template on 2026-08-01T13:07:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'spring-template'
primary_region = 'ams'

[build]

[env]
  JAVA_OPTS = '-Xmx256m -Xms64m'
  SERVER_FORWARD_HEADERS_STRATEGY = 'NATIVE'
  SPRING_PROFILES_ACTIVE = 'flyio'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
  memory_mb = 512
  processes = ['app']

[processes]
  app = ''
